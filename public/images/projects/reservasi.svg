<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" rx="16" fill="#F4F5F1"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#E2E4DC" stroke-width="1"/>

  <!-- Subtle Grid -->
  <line x1="80" y1="0" x2="80" y2="500" stroke="#E9EBE2" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="500" stroke="#E9EBE2" stroke-width="1"/>

  <!-- Main Application Frame -->
  <rect x="120" y="70" width="560" height="360" rx="10" fill="#FFFFFF" stroke="#D9DDD3" stroke-width="1"/>

  <!-- Header Bar -->
  <line x1="120" y1="115" x2="680" y2="115" stroke="#EBEDE5" stroke-width="1"/>
  <rect x="144" y="88" width="18" height="18" rx="4" fill="#1B4D3E"/>
  <rect x="174" y="93" width="110" height="8" rx="4" fill="#0D0D0D"/>
  <rect x="580" y="88" width="80" height="18" rx="9" fill="#1B4D3E" fill-opacity="0.1"/>
  <rect x="595" y="94" width="50" height="6" rx="3" fill="#1B4D3E"/>

  <!-- Calendar Section -->
  <g transform="translate(144, 135)">
    <!-- Calendar Toolbar -->
    <rect width="512" height="34" rx="6" fill="#F9FAF7" stroke="#E5E8DF" stroke-width="1"/>
    <rect x="12" y="11" width="70" height="12" rx="3" fill="#0D0D0D"/>
    <rect x="96" y="11" width="44" height="12" rx="3" fill="#888E83"/>
    <rect x="152" y="11" width="44" height="12" rx="3" fill="#888E83"/>
    <circle cx="478" cy="17" r="8" fill="#1B4D3E" fill-opacity="0.12"/>
    <rect x="472" y="11" width="12" height="12" rx="3" fill="#1B4D3E"/>

    <!-- Week Day Labels -->
    <g transform="translate(0, 46)">
      <rect width="72" height="14" rx="2" fill="#888E83" fill-opacity="0.35"/>
      <rect x="80" width="72" height="14" rx="2" fill="#888E83" fill-opacity="0.35"/>
      <rect x="160" width="72" height="14" rx="2" fill="#888E83" fill-opacity="0.35"/>
      <rect x="240" width="72" height="14" rx="2" fill="#888E83" fill-opacity="0.35"/>
      <rect x="320" width="72" height="14" rx="2" fill="#888E83" fill-opacity="0.35"/>
      <rect x="400" width="72" height="14" rx="2" fill="#888E83" fill-opacity="0.35"/>
    </g>

    <!-- Calendar Events -->
    <g transform="translate(0, 68)">
      <!-- Row 1 -->
      <rect width="72" height="40" rx="4" fill="#1B4D3E" fill-opacity="0.1" stroke="#1B4D3E" stroke-width="1"/>
      <rect x="8" y="8" width="44" height="6" rx="2" fill="#1B4D3E"/>
      <rect x="8" y="20" width="28" height="5" rx="2" fill="#1B4D3E" fill-opacity="0.55"/>
      <rect x="80" width="72" height="40" rx="4" fill="#B48C36" fill-opacity="0.1" stroke="#B48C36" stroke-width="1"/>
      <rect x="88" y="8" width="40" height="6" rx="2" fill="#B48C36"/>
      <rect x="88" y="20" width="32" height="5" rx="2" fill="#B48C36" fill-opacity="0.55"/>
      <!-- Row 2 -->
      <g transform="translate(0, 48)">
        <rect width="72" height="40" rx="4" fill="#F9FAF7" stroke="#E5E8DF" stroke-width="1"/>
        <rect x="80" width="72" height="40" rx="4" fill="#1B4D3E" fill-opacity="0.08" stroke="#1B4D3E" stroke-width="1"/>
        <rect x="88" y="8" width="52" height="6" rx="2" fill="#1B4D3E"/>
        <rect x="240" width="72" height="40" rx="4" fill="#B48C36" fill-opacity="0.1" stroke="#B48C36" stroke-width="1"/>
        <rect x="248" y="8" width="36" height="6" rx="2" fill="#B48C36"/>
      </g>
      <!-- Row 3 -->
      <g transform="translate(0, 96)">
        <rect width="72" height="40" rx="4" fill="#F9FAF7" stroke="#E5E8DF" stroke-width="1"/>
        <rect x="80" width="72" height="40" rx="4" fill="#F9FAF7" stroke="#E5E8DF" stroke-width="1"/>
        <rect x="160" width="72" height="40" rx="4" fill="#1B4D3E" fill-opacity="0.1" stroke="#1B4D3E" stroke-width="1"/>
        <rect x="168" y="8" width="48" height="6" rx="2" fill="#1B4D3E"/>
        <rect x="168" y="20" width="30" height="5" rx="2" fill="#1B4D3E" fill-opacity="0.55"/>
        <rect x="320" width="72" height="40" rx="4" fill="#F9FAF7" stroke="#E5E8DF" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- Bottom Labels -->
  <rect x="144" y="438" width="120" height="7" rx="3" fill="#E2E4DC"/>
  <rect x="276" y="438" width="64" height="7" rx="3" fill="#E2E4DC"/>
</svg>
