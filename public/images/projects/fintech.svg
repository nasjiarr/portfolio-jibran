<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" rx="16" fill="#F4F5F1"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#E2E4DC" stroke-width="1"/>
  
  <!-- Subtle Grid -->
  <line x1="80" y1="0" x2="80" y2="500" stroke="#E9EBE2" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="500" stroke="#E9EBE2" stroke-width="1"/>
  
  <!-- Main Dashboard Frame -->
  <rect x="120" y="70" width="560" height="360" rx="10" fill="#FFFFFF" stroke="#D9DDD3" stroke-width="1"/>
  
  <!-- Header Bar -->
  <line x1="120" y1="115" x2="680" y2="115" stroke="#EBEDE5" stroke-width="1"/>
  <rect x="144" y="88" width="18" height="18" rx="4" fill="#1B4D3E"/>
  <rect x="174" y="93" width="90" height="8" rx="4" fill="#0D0D0D"/>
  <rect x="580" y="88" width="80" height="18" rx="9" fill="#1B4D3E" fill-opacity="0.1"/>
  <rect x="595" y="94" width="50" height="6" rx="3" fill="#1B4D3E"/>

  <!-- Metric Cards -->
  <g transform="translate(144, 135)">
    <!-- Card 1 -->
    <rect width="118" height="70" rx="6" fill="#F9FAF7" stroke="#E5E8DF" stroke-width="1"/>
    <rect x="12" y="14" width="40" height="6" rx="2" fill="#888E83"/>
    <rect x="12" y="28" width="65" height="12" rx="3" fill="#0D0D0D"/>
    <rect x="12" y="48" width="35" height="6" rx="2" fill="#1B4D3E"/>

    <!-- Card 2 -->
    <g transform="translate(132, 0)">
      <rect width="118" height="70" rx="6" fill="#F9FAF7" stroke="#E5E8DF" stroke-width="1"/>
      <rect x="12" y="14" width="45" height="6" rx="2" fill="#888E83"/>
      <rect x="12" y="28" width="55" height="12" rx="3" fill="#0D0D0D"/>
      <rect x="12" y="48" width="45" height="6" rx="2" fill="#B48C36"/>
    </g>

    <!-- Card 3 -->
    <g transform="translate(264, 0)">
      <rect width="118" height="70" rx="6" fill="#F9FAF7" stroke="#E5E8DF" stroke-width="1"/>
      <rect x="12" y="14" width="50" height="6" rx="2" fill="#888E83"/>
      <rect x="12" y="28" width="70" height="12" rx="3" fill="#0D0D0D"/>
      <rect x="12" y="48" width="30" height="6" rx="2" fill="#1B4D3E"/>
    </g>

    <!-- Card 4 -->
    <g transform="translate(396, 0)">
      <rect width="116" height="70" rx="6" fill="#F9FAF7" stroke="#E5E8DF" stroke-width="1"/>
      <rect x="12" y="14" width="35" height="6" rx="2" fill="#888E83"/>
      <rect x="12" y="28" width="50" height="12" rx="3" fill="#0D0D0D"/>
      <rect x="12" y="48" width="40" height="6" rx="2" fill="#888E83"/>
    </g>
  </g>

  <!-- Big Interactive Chart Area -->
  <rect x="144" y="225" width="512" height="180" rx="8" fill="#FAFAF8" stroke="#E5E8DF" stroke-width="1"/>
  <line x1="164" y1="280" x2="636" y2="280" stroke="#ECEFE8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="164" y1="330" x2="636" y2="330" stroke="#ECEFE8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="164" y1="380" x2="636" y2="380" stroke="#ECEFE8" stroke-width="1"/>

  <!-- Smooth Trend Line -->
  <path d="M 170 360 C 230 330, 270 345, 330 290 C 390 235, 450 310, 510 260 C 560 218, 600 240, 630 230" fill="none" stroke="#1B4D3E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 170 360 C 230 330, 270 345, 330 290 C 390 235, 450 310, 510 260 C 560 218, 600 240, 630 230 L 630 380 L 170 380 Z" fill="#1B4D3E" fill-opacity="0.05"/>

  <!-- Data point dot -->
  <circle cx="510" cy="260" r="4.5" fill="#FAFAF8" stroke="#1B4D3E" stroke-width="2"/>
  <rect x="475" y="225" width="70" height="22" rx="4" fill="#0D0D0D"/>
  <rect x="485" y="233" width="50" height="6" rx="2" fill="#FFFFFF"/>
</svg>
