<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" rx="16" fill="#F6F5F2"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#E6E4DD" stroke-width="1"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="80" y1="0" x2="80" y2="500" stroke="#ECEAE3" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="500" stroke="#ECEAE3" stroke-width="1"/>

  <!-- Storefront Layout -->
  <rect x="130" y="70" width="540" height="360" rx="8" fill="#FFFFFF" stroke="#DFDDD5" stroke-width="1"/>
  
  <!-- Nav Bar -->
  <line x1="130" y1="115" x2="670" y2="115" stroke="#EDEDE5" stroke-width="1"/>
  <rect x="155" y="90" width="60" height="12" rx="3" fill="#0D0D0D"/>
  <rect x="360" y="93" width="35" height="6" rx="3" fill="#8E8C84"/>
  <rect x="410" y="93" width="40" height="6" rx="3" fill="#8E8C84"/>
  <rect x="465" y="93" width="35" height="6" rx="3" fill="#8E8C84"/>
  <circle cx="635" cy="96" r="8" fill="#F3F2EB"/>

  <!-- Main Product Display -->
  <g transform="translate(155, 140)">
    <!-- Big Product Image Frame -->
    <rect width="250" height="260" rx="6" fill="#F7F6F2" stroke="#E6E4DC" stroke-width="1"/>
    <!-- Minimalist Ceramic Vase Object drawing -->
    <path d="M 125 185 C 105 185, 95 240, 95 280 C 95 320, 110 350, 125 350 C 140 350, 155 320, 155 280 C 155 240, 145 185, 125 185 Z" fill="#E5DEC9" transform="translate(0, -90)"/>
    <ellipse cx="125" cy="95" rx="15" ry="4" fill="#D6CDAF"/>
    <circle cx="215" cy="30" r="14" fill="#1B4D3E" fill-opacity="0.1"/>
    <rect x="208" y="29" width="14" height="2" fill="#1B4D3E"/>

    <!-- Right Side Product Info -->
    <g transform="translate(280, 15)">
      <rect width="50" height="14" rx="7" fill="#B48C36" fill-opacity="0.15"/>
      <rect x="10" y="4" width="30" height="6" rx="2" fill="#B48C36"/>
      
      <rect y="28" width="170" height="16" rx="3" fill="#0D0D0D"/>
      <rect y="50" width="130" height="10" rx="2" fill="#787770"/>

      <line y1="75" x2="190" y2="75" stroke="#EBE9E2" stroke-width="1"/>
      
      <rect y="92" width="60" height="14" rx="3" fill="#1B4D3E"/>

      <rect y="125" width="180" height="6" rx="2" fill="#99978F"/>
      <rect y="137" width="165" height="6" rx="2" fill="#C2C0B7"/>
      <rect y="149" width="140" height="6" rx="2" fill="#DCDAD0"/>

      <rect y="180" width="185" height="34" rx="6" fill="#1B4D3E"/>
      <rect x="60" y="193" width="65" height="8" rx="2" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
